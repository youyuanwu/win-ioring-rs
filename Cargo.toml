[workspace]
members = ["crates/win-ioring", "crates/win-ioring-tests"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
win-ioring = { path = "crates/win-ioring" }
futures = "0.3"
bitflags = "2"
tokio = { version = "1", features = ["time", "rt", "macros"] }
toml = "0.9"

[workspace.dependencies.windows]
version = "0.62"
features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
]
