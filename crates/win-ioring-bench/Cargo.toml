[package]
name = "win-ioring-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
futures.workspace = true
win-ioring.workspace = true
# The workspace's own single-threaded executor, so this crate's `!Send` work can
# be driven without depending on a particular runtime for it.
win-ioring-tests = { path = "../win-ioring-tests" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
# Only for the available-physical-memory query the report needs. Declared here
# rather than widened into the workspace `windows` entry so the feature never
# enters `win-ioring`'s declared surface and a downstream consumer never
# compiles it — the same reasoning as the `Win32_System_Pipes` dev-dependency.
windows = { workspace = true, features = ["Win32_System_SystemInformation"] }

[lints]
workspace = true
