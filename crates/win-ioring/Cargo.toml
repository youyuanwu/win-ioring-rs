[package]
name = "win-ioring"
version.workspace = true
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
futures.workspace = true
bitflags.workspace = true
# Two namespaces beyond the workspace baseline, both required by named pipe
# support and neither optional.
#
# `Win32_System_Pipes` was a dev-dependency until pipes shipped, on the stated
# grounds that the library should keep a narrower platform surface than its
# tests. **Shipping `pipe::Server` and `pipe::Client` reverses that decision.**
# It has to: the types are public, and a public type cannot be built from a
# namespace the library does not have.
#
# The obvious alternative was a default-off feature, as `handle-mode-query`
# below does for one diagnostic method. It was rejected, and the distinction is
# not the compile cost but what is being gated. `handle-mode-query` gates a
# single query whose absence leaves every other API intact; a feature gating
# `pipe` would gate a public *type surface*, so downstream code either compiles
# against a different crate than its neighbours or turns the feature on
# universally and pays the cost anyway. A conditional type is also a conditional
# entry in every doc page, error enum discussion and example that mentions it.
# Gating a diagnostic is a reasonable trade; gating core functionality is a
# worse one.
#
# `Win32_System_IO` is the second reversal, and it is the accept path's doing.
# `ConnectNamedPipe` cannot be expressed as an IoRing operation — the op-code
# set this crate can build is closed and contains no connect — so the server's
# accept runs as an overlapped Win32 call and needs `OVERLAPPED`, `CancelIoEx`
# and `GetOverlappedResult`, all of which live here. Promoting
# `Win32_System_Pipes` does not pull it in; they are siblings.
windows = { workspace = true, features = [
    "Win32_System_Pipes",
    "Win32_System_IO",
] }

# Off by default, and deliberately so.
#
# `File::is_synchronous` needs `NtQueryInformationFile`/`FileModeInformation`,
# which is the only way to read back whether a handle really is overlapped:
# `GetFileInformationByHandleEx` cannot report it. That was established when the
# unbuffered arm needed the same answer, and the narrower API was looked for and
# not found.
#
# Reaching it costs two additional `windows` namespaces. It cost three until
# named pipe support made `Win32_System_IO` unconditional above; the feature no
# longer has to carry it. Enabling the remaining two unconditionally would put
# them in every downstream consumer's compile, which
# `crates/win-ioring-bench/Cargo.toml` records a decision against. A default-off
# feature preserves that decision for *this* query: a consumer who does not ask
# for it compiles exactly what it compiled before the feature existed.
#
# That reasoning no longer extends to `Win32_System_Pipes`, which used to be
# cited here as the parallel case. It is now a real dependency, for the reasons
# given above, and the two decisions have diverged rather than one having
# quietly overruled the other.
#
# The `win-ioring` unit test `is_synchronous_distinguishes_both_handle_modes`
# exercises the on configuration, and CI's two `--all-features` test steps run
# it, so the feature is not left to bit-rot.
#
# `win-ioring-bench` deliberately does NOT enable it, though it was the obvious
# candidate. The bench crate already declares these three namespaces directly
# and has its own `file_mode` read-back, so enabling the feature there would buy
# no coverage — and it would cost real coverage. Nothing else in the workspace
# enables the feature, which is what makes `cargo check/clippy/doc --workspace`
# build the *default* configuration. That is the configuration downstream
# consumers compile, so it is the one the broad CI steps should cover. Had the
# bench enabled it, feature unification would have flipped every workspace step
# onto the on configuration and left the default unbuilt by anything.
#
# CI therefore covers the on configuration with three targeted `-p win-ioring
# --features handle-mode-query` steps instead. Both directions of that split
# were verified empirically with a `compile_error!` behind the feature's `cfg`,
# not assumed. See `.github/workflows/CI.yml`.
#
# Rejected alternative: tracking handle *provenance* instead of querying —
# `File::open`/`create` know they set the flag, adopted handles are unknown —
# which would need no new platform surface at all. It fails on the only case
# that matters: it returns "unknown" for exactly the adopted handles the query
# exists to interrogate, and answers confidently only where the constructor
# already guarantees the answer. An API that resolves only the question the
# caller did not need to ask is worse than no API.
[features]
handle-mode-query = [
    "windows/Wdk_Foundation",
    "windows/Wdk_Storage_FileSystem",
]

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
