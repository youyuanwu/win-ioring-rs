[package]
name = "win-ioring"
version.workspace = true
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
futures.workspace = true
bitflags.workspace = true
windows.workspace = true

[dev-dependencies]
tokio.workspace = true
# Named pipes are the only source of a genuinely long-running I/O operation
# available here, and shutdown tests need one to avoid passing vacuously.
# Dev-only, so the library itself keeps its narrower platform surface.
windows = { workspace = true, features = ["Win32_System_Pipes"] }

[lints]
workspace = true
