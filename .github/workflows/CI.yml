name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest ]
    steps:
    - uses: actions/checkout@v4

    - name: Read rust version from rust-toolchain.toml
      id: rust-toolchain
      shell: pwsh
      run: |
        $channel = (Select-String -Path rust-toolchain.toml -Pattern '^\s*channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
        if (-not $channel) { throw "Could not read channel from rust-toolchain.toml" }
        "toolchain=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Install rust ${{ steps.rust-toolchain.outputs.toolchain }}
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}
        components: rustfmt, clippy

    - name: Run cargo check
      run: cargo check --workspace --all-targets

    - name: Run cargo fmt
      run: cargo fmt --all -- --check
    
    - name: Run cargo clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Run cargo test
      run: cargo test --workspace --all-targets --all-features

    # `--all-targets` excludes documentation tests, and the crate's
    # compile-time guarantees are asserted by `compile_fail` doc-tests, so they
    # have to be invoked explicitly or those assertions never run.
    - name: Run doc tests
      run: cargo test --workspace --all-features --doc

    - name: Build documentation
      run: cargo doc --workspace --no-deps
      env:
        RUSTDOCFLAGS: -D warnings